name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "wordpress-plugin/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f android/app/google-services.json ]; then
            echo "از فایل google-services.json داخل ریپو استفاده می‌شود."
          else
            echo "::warning::google-services.json پیدا نشد؛ APK با Firebase آزمایشی ساخته می‌شود (نصب می‌شود ولی نوتیفیکیشن کار نمی‌کند)."
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$S_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$S_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$S_KEYPASS" >> "$GITHUB_ENV"
          else
            echo "::warning::کلید امضای اختصاصی تنظیم نشده؛ یک کلید موقت ساخته می‌شود (برای نصب مستقیم کافی است ولی برای انتشار در مارکت مناسب نیست)."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/auto.jks" -alias clnshop \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass clnshop-build -keypass clnshop-build \
              -dname "CN=Clnshop, O=Clnshop, C=IR"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/auto.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=clnshop-build" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=clnshop" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=clnshop-build" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/clnshop-app.apk
          ls -la dist

      - name: Package WordPress plugin
        run: |
          cd wordpress-plugin
          zip -r ../dist/clnshop-app-push.zip clnshop-app-push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clnshop-app-apk
          path: dist/clnshop-app.apk

      - name: Publish APK to a public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "آخرین نسخه اپ"
          body: "آخرین APK ساخته‌شده. فایل clnshop-app.apk را دانلود و نصب کنید."
          files: |
            dist/clnshop-app.apk
            dist/clnshop-app-push.zip
          make_latest: true
